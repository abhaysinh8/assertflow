name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Exercise example API workflows
        run: |
          assertflow run examples/crud-flow/user-lifecycle.yaml --report junit --output reports/examples.xml
          assertflow run examples/order-flow/order-lifecycle.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assertflow-reports
          path: reports/
          if-no-files-found: ignore

