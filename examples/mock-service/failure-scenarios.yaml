name: deterministic-failure-scenarios

mocks:
  - name: transient dependency
    request: {method: GET, path: /dependency}
    responses:
      - status: 503
        json: {error: temporarily unavailable}
      - status: 200
        json: {state: recovered}
    expect_calls: 2
  - name: malformed dependency
    request: {method: GET, path: /malformed}
    response:
      status: 200
      headers: {Content-Type: application/json}
      body: "{not-valid-json"
    expect_calls: 1

steps:
  - name: explicit retry
    request: {method: GET, url: "http://mock/dependency"}
    retry:
      attempts: 2
      delay_ms: 10
      on_status: [503]
    assert:
      status: 200
      json: {state: recovered}

  - name: malformed response is observable
    request: {method: GET, url: "http://mock/malformed"}
    assert:
      status: 200
      headers:
        content-type: {contains: application/json}

